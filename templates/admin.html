
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion administrateur - FALLOU GOLOBALE BUSNESS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #171717;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .connexion {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }

        .connexion h1 {
            text-align: center;
            color: #171717;
            margin-bottom: 10px;
        }

        .connexion h2 {
            text-align: center;
            color: #b38b43;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .connexion label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .connexion input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .connexion button {
            width: 100%;
            padding: 14px;
            background: #d6ad60;
            color: #171717;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .connexion button:hover {
            background: #c39747;
        }

        .retour {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #171717;
            text-decoration: none;
        }

        .retour:hover {
            color: #b38b43;
        }
    </style>
</head>

<body>

<div class="connexion">

    <h1>FALLOU</h1>

    <h2>ESPACE ADMINISTRATEUR</h2>

    <form method="POST" action="{{ url_for('admin') }}">

        <label for="mot_de_passe">
            Mot de passe administrateur
        </label>

        <input
            type="password"
            id="mot_de_passe"
            name="mot_de_passe"
            placeholder="Entrez votre mot de passe"
            required
            autocomplete="current-password">

        <button type="submit">
            Se connecter
        </button>

    </form>

    <a href="{{ url_for('accueil') }}" class="retour">
        ← Retour à la boutique
    </a>

</div>

</body>
</html>
