
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion administrateur</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .connexion-admin {
            max-width: 400px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .connexion-admin input {
            width: 100%;
            padding: 14px;
            margin: 12px 0 20px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .connexion-admin button {
            width: 100%;
            padding: 14px;
            background: #d6ad60;
            color: #171717;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>FALLOU GOLOBALE BUSNESS</h1>
        <p>ESPACE ADMINISTRATEUR</p>
    </header>

    <section class="connexion-admin">
        <h2>Connexion administrateur</h2>

        <form method="POST" action="{{ url_for('admin') }}">
            <label for="mot_de_passe">Mot de passe</label>

            <input
                type="password"
                id="mot_de_passe"
                name="mot_de_passe"
                placeholder="Entrez votre mot de passe"
                autocomplete="current-password"
                required
            >

            <input type="submit" value="Se connecter" style="width:100%; padding:15px; background:#d6ad60; color:#171717; border:0; border-radius:8px; font-size:16px; font-weight:bold;">
        </form>
    </section>

</body>
</html>
